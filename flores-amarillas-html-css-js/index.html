<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Dancing Script', cursive;
        }

        .back {
            position: fixed;
            padding: 0;
            margin: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff8dc;
            animation-name: backdiv;
            animation-duration: 3500ms;
            animation-iteration-count: infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 35px;
            font-weight: bold;
            color: #e6a800;
            text-align: center;
            margin-bottom: 20px;
        }

        .heart {
            position: relative;
            margin: 20px auto;
            background-color: red;
            height: 150px;
            width: 150px;
            transform: rotate(-45deg);
            animation-name: beat;
            animation-duration: 3500ms;
            animation-iteration-count: infinite;
        }

        .heart:after,
        .heart:before {
            background-color: red;
            content: "";
            border-radius: 50%;
            position: absolute;
            width: 150px;
            height: 150px;
        }

        .heart:after {
            top: 0;
            left: 80px;
        }

        .heart:before {
            top: -80px;
            left: 0;
        }

        @keyframes backdiv {
            50% {
                background: #ffeb99;
            }
        }

        @keyframes beat {
            0% {
                transform: scale(1) rotate(-45deg);
            }

            50% {
                transform: scale(0.6) rotate(-45deg);
            }
        }

        .bday {
            text-align: center;
            font-size: 18px;
            font-family: 'Dancing Script', cursive;
            font-weight: 600;
            color: #704214;
            margin: 20px auto;
            padding: 15px;
            background-color: #ffd700;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);
        }

        .boton {
            margin-top: 50px;
        }

        button {
            background-color: #ffcc00;
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e6a800;
        }

        a {
            color: black;
            font-weight: bold;
            text-decoration: none;
        }

        .elements {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <title>Flores Amarillas</title>
</head>

<body>
    <div class="back">
        <div class="title">Para Yessi linda ❤️</div>
        <div class="elements">
            <div class="heart"></div>
        </div>
        <footer>
            <div class="boton">
                <button><a href="index2.html"><span>Clic</span></a></button>
            </div>
        </footer>
    </div>
</body>

</html>
